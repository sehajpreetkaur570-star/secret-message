<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muskan 😂</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffd6e8, #d9d0ff);
  overflow: hidden;
}

.card {
  width: min(92%, 430px);
  padding: 38px 25px;
  text-align: center;
  background: #ffffffee;
  border-radius: 30px;
  box-shadow: 0 20px 60px #0002;
}

.emoji {
  font-size: 70px;
  animation: bounce 1.3s infinite;
}

h1 {
  font-size: 30px;
  color: #ff4f87;
  line-height: 1.25;
}

p {
  font-size: 18px;
  color: #555;
  line-height: 1.5;
}

button {
  border: 0;
  border-radius: 30px;
  padding: 14px 28px;
  margin: 10px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#yes {
  background: #ff4f87;
  color: white;
}

#no {
  background: #eee;
  color: #555;
  position: relative;
}

#result {
  display: none;
  color: #ff4f87;
  font-size: 22px;
  font-weight: bold;
  margin-top: 20px;
}

.heart {
  position: fixed;
  bottom: -30px;
  font-size: 25px;
  animation: floatUp 4s linear forwards;
}

@keyframes bounce {
  50% {
    transform: scale(1.12);
  }
}

@keyframes floatUp {
  to {
    transform: translateY(-110vh);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card">

  <div class="emoji">😂❤️</div>

  <h1>
    Muskan bandri moti te bauni hai? 😭😂
  </h1>

  <p>
    ਇੱਕ ਬਹੁਤ ਹੀ ਜ਼ਰੂਰੀ ਸਵਾਲ ਹੈ... 👀
  </p>

  <button id="yes" onclick="yes()">
    YES ❤️
  </button>

  <button id="no" onmouseenter="moveNo()" ontouchstart="moveNo()">
    NO 😭
  </button>

  <div id="result">
    Hahaha, ਮੈਨੂੰ ਪਹਿਲਾਂ ਹੀ ਪਤਾ ਸੀ! 😂❤️
  </div>

</div>

<script>

const noButton = document.getElementById("no");

function moveNo() {

  const maxX = window.innerWidth - noButton.offsetWidth - 20;
  const maxY = window.innerHeight - noButton.offsetHeight - 20;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  noButton.style.position = "fixed";
  noButton.style.left = x + "px";
  noButton.style.top = y + "px";
}

function yes() {

  document.getElementById("result").style.display = "block";

  document.getElementById("yes").style.display = "none";
  document.getElementById("no").style.display = "none";

  for (let i = 0; i < 25; i++) {

    setTimeout(() => {

      const heart = document.createElement("div");

      heart.className = "heart";

      heart.textContent =
        ["❤️", "😂", "💕", "✨"][Math.floor(Math.random() * 4)];

      heart.style.left =
        Math.random() * 100 + "vw";

      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 4500);

    }, i * 90);

  }
}

</script>

</body>
</html>
